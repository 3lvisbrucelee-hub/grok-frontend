<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok Bot Trading Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; }
        .grok-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; }
        .log-box { background-color: #090d11; border: 1px solid #30363d; font-size: 13px; height: 180px; overflow-y: auto; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center grok-card p-4">
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <span class="inline-block w-3 h-3 rounded-full bg-green-500"></span> Grok Bot Cloud Engine
                </h1>
                <p class="text-xs text-gray-400">Modalità: Trading Automatico HTTP Cloud</p>
            </div>
            <div>
                <span id="status-badge" class="px-3 py-1 text-xs rounded bg-green-900 text-green-300 font-bold border border-green-700">
                    Connesso (HTTP)
                </span>
            </div>
        </div>

        <!-- Dashboard / Azioni -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- Stato Wallet -->
            <div class="grok-card p-5">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Wallet Cloud Bot</h2>
                <div class="text-2xl font-extrabold text-white" id="wallet-status">Sincronizzazione...</div>
                <p class="text-xs text-gray-400 mt-2">Esegue swap automatici su Jupiter DEX senza conferme manuali.</p>
            </div>

            <!-- Azioni Rapide -->
            <div class="grok-card p-5">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Comando Manuale Immediato</h2>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="triggerAction('FORCE_BUY')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-3 rounded text-sm transition">
                        COMPRA
                    </button>
                    <button onclick="triggerAction('TOGGLE_BOT')" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 px-3 rounded text-sm transition">
                        PAUSA
                    </button>
                    <button onclick="triggerAction('FORCE_SELL')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-2 px-3 rounded text-sm transition">
                        VENDI
                    </button>
                </div>
            </div>

        </div>

        <!-- Terminale Log -->
        <div class="grok-card p-4">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Terminal Log (Live da Render)</h2>
            <div id="log-terminal" class="log-box p-3 rounded space-y-1">
                <div class="text-gray-500">[SYSTEM] Dashboard avviata. Comunicazione HTTP attiva.</div>
            </div>
        </div>

    </div>

    <script>
        const BACKEND_URL = "https://grok-backend-u1c1.onrender.com";

        function addLog(text, category = "info") {
            const terminal = document.getElementById("log-terminal");
            const entry = document.createElement("div");
            
            let colorClass = "text-gray-300";
            if (category === "exec") colorClass = "text-blue-400";
            if (category === "fill") colorClass = "text-green-400 font-bold";
            if (category === "warn") colorClass = "text-amber-400";
            
            const timestamp = new Date().toLocaleTimeString();
            entry.className = colorClass;
            entry.innerText = `[${timestamp}] ${text}`;
            
            terminal.appendChild(entry);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function checkBackendHealth() {
            try {
                const res = await fetch(`${BACKEND_URL}/`);
                const data = await res.json();
                if (data.wallet) {
                    document.getElementById("wallet-status").innerText = `${data.wallet.substring(0, 6)}...${data.wallet.substring(data.wallet.length - 4)}`;
                } else {
                    document.getElementById("wallet-status").innerText = "Wallet Pronto";
                }
            } catch (err) {
                document.getElementById("wallet-status").innerText = "In attesa del backend...";
            }
        }

        async function triggerAction(actionName) {
            addLog(`[EXEC] Invio comando '${actionName}' a Render via HTTP...`, "exec");
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/trade`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: actionName })
                });
                
                const data = await response.json();
                if (data.success) {
                    addLog(data.message, "fill");
                } else {
                    addLog(data.message, "warn");
                }
            } catch (err) {
                addLog(`[ERROR] Connessione al server fallita: ${err.message}`, "warn");
            }
        }

        // Verifica lo stato del backend all'avvio
        checkBackendHealth();
    </script>
</body>
</html>
